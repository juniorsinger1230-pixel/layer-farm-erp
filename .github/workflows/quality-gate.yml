name: quality-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate | tee gate-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          retention-days: 14
          path: |
            coverage/
            sbom/
            sca-scan-result.json
            quality-gate-result.json
            quality-policy.json
            security-check-result.json
            license-check-result.json
            gate-output.txt
  deployment-static:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t layer-farm-erp-api:ci .
      - run: docker build --target web -t layer-farm-erp-web:ci .
      - run: docker run --rm -v "$PWD/deploy/k8s:/manifests" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /manifests/base.yaml
