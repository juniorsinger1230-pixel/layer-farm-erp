name: layer-farm-erp
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: layer_farm
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d layer_farm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8.1.4-alpine
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${VALKEY_PORT:-56379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ../.., target: api }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      MIGRATION_DIR: /app/migrations
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:?}@postgres:5432/layer_farm
    command: ["node", "dist/packages/database/src/migrate.js"]
    restart: "no"
  api:
    build: { context: ../.., target: api }
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 3100
      BODY_LIMIT_BYTES: "1048576"
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:?}@postgres:5432/layer_farm
      DATABASE_SSL: "false"
      VALKEY_URL: redis://valkey:6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      MFA_ENABLED: "${MFA_ENABLED:-false}"
      EVENT_QUEUE_NAME: layer-farm-events
      ATTACHMENT_DIR: /data/attachments
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-3650}
      PRINT_SANDBOX_MODE: "true"
      EXTERNAL_INTEGRATIONS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-300}"
      LOGIN_RATE_LIMIT_MAX: "${LOGIN_RATE_LIMIT_MAX:-20}"
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: "10000"
    ports:
      - "${API_PORT:-3100}:3100"
    volumes:
      - attachment-data:/data/attachments
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: { context: ../.., target: web }
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp:size=32m", "/var/cache/nginx:size=32m", "/var/run:size=1m"]
    restart: unless-stopped
volumes:
  postgres-data:
  valkey-data:
  attachment-data:
