apiVersion: v1
kind: Namespace
metadata:
  name: layer-farm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: layer-farm
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example.com/layer-farm-erp-api:REPLACE_WITH_APPROVED_DIGEST
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3100 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3100" }
            - { name: ATTACHMENT_DIR, value: /data/attachments }
            - { name: ATTACHMENT_RETENTION_DAYS, value: "3650" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: layer-farm-runtime, key: database-url } }
            - name: VALKEY_URL
              valueFrom: { secretKeyRef: { name: layer-farm-runtime, key: valkey-url } }
            - name: JWT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: layer-farm-runtime, key: jwt-signing-key } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: attachments, mountPath: /data/attachments }
            - { name: tmp, mountPath: /tmp }
          startupProbe: { httpGet: { path: /health/live, port: 3100 }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /health/ready, port: 3100 }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: 3100 }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
      volumes:
        - { name: attachments, persistentVolumeClaim: { claimName: attachments } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attachments
  namespace: layer-farm
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: layer-farm
spec:
  selector: { app: api }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate
  namespace: layer-farm
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example.com/layer-farm-erp-api:REPLACE_WITH_APPROVED_DIGEST
          command: ["node", "dist/packages/database/src/migrate.js"]
          env:
            - { name: NODE_ENV, value: production }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: layer-farm-runtime, key: database-url } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: layer-farm
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: registry.example.com/layer-farm-erp-web:REPLACE_WITH_APPROVED_DIGEST
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 20 }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: layer-farm
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: layer-farm
spec:
  minAvailable: 1
  selector: { matchLabels: { app: api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: layer-farm
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
