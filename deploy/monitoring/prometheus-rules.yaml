apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: layer-farm-erp-alerts
  namespace: layer-farm
spec:
  groups:
    - name: availability
      rules:
        - alert: LayerFarmAPIDown
          expr: up{job="layer-farm-api"} == 0
          for: 2m
          labels: { severity: critical, domain: platform }
          annotations:
            summary: "Layer Farm ERP API is unavailable"
            runbook: "https://runbooks.example.com/layer-farm/api-down"
        - alert: LayerFarmWebDown
          expr: up{job="layer-farm-web"} == 0
          for: 2m
          labels: { severity: critical, domain: platform }
          annotations:
            summary: "Layer Farm ERP Web is unavailable"
            runbook: "https://runbooks.example.com/layer-farm/web-down"
        - alert: PostgreSQLDown
          expr: pg_up{job="postgres"} == 0
          for: 1m
          labels: { severity: critical, domain: data }
          annotations:
            summary: "PostgreSQL is unavailable"
            runbook: "https://runbooks.example.com/layer-farm/postgres-down"
        - alert: ValkeyDown
          expr: redis_up{job="valkey"} == 0
          for: 1m
          labels: { severity: critical, domain: platform }
          annotations:
            summary: "Valkey is unavailable"
            runbook: "https://runbooks.example.com/layer-farm/valkey-down"
    - name: performance
      rules:
        - alert: HighHTTP5xxRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 1
          for: 5m
          labels: { severity: critical, domain: platform }
          annotations:
            summary: "Service {{ $labels.service }} has elevated 5xx errors"
        - alert: HighHTTPLatencyP95
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
          for: 10m
          labels: { severity: warning, domain: platform }
          annotations:
            summary: "Service {{ $labels.service }} p95 latency exceeds 1 second"
        - alert: HighCPUUsage
          expr: avg(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod) / avg(kube_pod_container_resource_limits{resource="cpu"}) by (pod) > 0.8
          for: 10m
          labels: { severity: warning, domain: capacity }
          annotations:
            summary: "Pod {{ $labels.pod }} CPU usage exceeds 80%"
        - alert: HighMemoryUsage
          expr: working_set_bytes / kube_pod_container_resource_limits{resource="memory"} > 0.85
          for: 10m
          labels: { severity: warning, domain: capacity }
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage exceeds 85%"
    - name: data-protection
      rules:
        - alert: BackupStale
          expr: time() - backup_last_success_timestamp_seconds > 86400
          for: 15m
          labels: { severity: critical, domain: data }
          annotations:
            summary: "No successful database backup in the last 24 hours"
        - alert: DiskSpaceWarning
          expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.15
          for: 10m
          labels: { severity: warning, domain: capacity }
          annotations:
            summary: "Node filesystem free space is below 15%"
        - alert: DiskSpaceCritical
          expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.08
          for: 5m
          labels: { severity: critical, domain: capacity }
          annotations:
            summary: "Node filesystem free space is below 8%"
        - alert: CertificateExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 2592000
          for: 30m
          labels: { severity: warning, domain: security }
          annotations:
            summary: "TLS certificate expires within 30 days"
        - alert: PodRestartLoop
          expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
          for: 5m
          labels: { severity: warning, domain: platform }
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 3 times in 30 minutes"
